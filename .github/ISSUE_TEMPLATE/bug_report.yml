name: Bug Report
description: Laporkan bug yang dapat direproduksi
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor bug. Isi detail di bawah agar kami bisa reproduksi dan perbaiki cepat.

  - type: input
    id: version
    attributes:
      label: Versi Apex / Commit SHA
      description: Output `apex --version` atau commit SHA jika build dari source
      placeholder: "0.1.0-dev / abc1234"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS & Terminal
      description: Contoh: Ubuntu 24.04, Ghostty / macOS 15, iTerm2 / Windows 11, WSL2
      placeholder: "Ubuntu 24.04, Ghostty"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Deskripsi Bug
      description: Apa yang terjadi vs apa yang diharapkan
      placeholder: |
        Saat menjalankan `apex review --staged`, agent mengeluarkan error "connection refused" padahal tidak ada perubahan staged.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Langkah Reproduksi
      description: Step-by-step minimal untuk reproduksi
      placeholder: |
        1. `git init test-repo && cd test-repo`
        2. `echo "fn main() {}" > main.rs`
        3. `apex review --staged`
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log / Output Error
      description: Paste relevant log (gunakan code block). Jika panjang, lampirkan sebagai file.
      render: text
      placeholder: |
        $ apex review --staged
        Error: connection refused at 127.0.0.1:12345

  - type: dropdown
    id: component
    attributes:
      label: Komponen Terkait
      options:
        - "CLI (apex-cli)"
        - "TUI (tui)"
        - "Python Agent (apex/agent)"
        - "Rust Core (apex-core)"
        - "Bridge (PyO3)"
        - "Skill System"
        - "MCP"
        - "Protocol/IPC"
        - "Context Scan"
        - "Review/Commit/Ship"
        - "Build/CI"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - "P0 - Critical (outage, data loss, security)"
        - "P1 - High (major feature broken)"
        - "P2 - Medium (minor feature broken, workaround exists)"
        - "P3 - Low (cosmetic, enhancement)"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Sudah coba reproduksi di `main` branch terbaru
          required: true
        - label: Sudah cek issue existing (search sebelum buka baru)
          required: true
        - label: Bukan kerentanan keamanan (jika ya, laporkan via SECURITY.md)
          required: true